version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: citizen_ingestion
      POSTGRES_USER: citizen
      POSTGRES_PASSWORD: citizen123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      # Modules 2-4 share this Redis on the host, so the pipeline works the
      # same way with or without Compose.
      - "6379:6379"

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://citizen:citizen123@postgres:5432/citizen_ingestion
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_NAME: citizen-requests
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      # 8001 is this module's slot in the platform-wide port map; 8002-8004 are
      # Modules 2-4. See INTEGRATION_MAP.md.
      - "8001:8001"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
  minio-data:
